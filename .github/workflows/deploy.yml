name: Deploy Task Management frontend

on:
  push:
    branches: [main]

jobs:
  deploy-test:
    runs-on: [self-hosted, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy to test server
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "C:\Software\Task Server\HTML" /MIR /XD .git .github .vscode
          if %ERRORLEVEL% GEQ 8 (exit /b 1) else (exit /b 0)

  deploy-production:
    needs: deploy-test
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy to production server
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "C:\TestingCICD" /MIR /XD .git .github .vscode
          if %ERRORLEVEL% GEQ 8 (exit /b 1) else (exit /b 0)
