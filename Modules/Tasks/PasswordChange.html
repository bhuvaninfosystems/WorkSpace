<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link class="js-favicon" rel="icon" href="../../Config/assets/images/favicon.ico" type="image/x-icon" sizes="any">
    <title>Workspace - Change Password</title>

    <!-- CDN stack aligned with index.html -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../Config/style/global.css">

    <script>window.__PREMIUM_SKIP_INITIAL_PAGE_LOADER__ = true;</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="../../UI_Components/widgets/loading-overlay.js"></script>
    <script src="../../Config/cdn/sweetalert2_11.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body
    class="full-height-container overflow-y-auto font-['DM_Sans'] [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
    
    <!-- Auth Guard -->
    <script>
        if (!localStorage.getItem('LogUser')) {
            window.location.replace('../../index.html');
        }
    </script>

    <!-- Main Container -->
    <div class="flex w-full full-height-container">

        <!-- Content Section -->
        <div class="flex w-full md:w-[40%] relative flex items-center justify-center p-8 bg-gray-50">

            <!-- Back Button -->
            <a href="./Dashboard.html" class="absolute top-6 left-6 flex items-center justify-center w-10 h-10 rounded-full bg-white border border-gray-200 text-gray-500 hover:text-gray-800 shadow-sm transition-all duration-200" title="Go Back">
                <i class="bi bi-arrow-left text-xl leading-none"></i>
            </a>

            <div class="w-full max-w-sm">

                <div class="text-center mb-6">
                    <img src="../../Config/assets/images/Logo.png" alt="Workspace Logo"
                        class="mx-auto mb-4 h-auto w-20 object-contain">
                    <h1 class="mb-1 text-3xl font-medium text-gray-900 md:text-4xl">Reset <span
                            class="font-semibold text-[var(--primary-color)]">Password</span></h1>
                    <p class="text-gray-600 text-sm">Set a secure new password for your account.</p>
                </div>

                <!-- Password Change Form -->
                <div class="translate-y-0 opacity-100 transition duration-700">
                    <form id="password-change-form" class="space-y-4">
                        <!-- Current Password Field -->
                        <div>
                            <label for="current-password" class="block text-sm font-semibold text-gray-600 ml-2 mb-1">
                                Current Password *
                            </label>
                            <div class="relative">
                                <input type="password" id="current-password" name="currentPassword"
                                    class="w-full px-3 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)] transition-all duration-200 text-gray-900 placeholder-gray-400 text-sm"
                                    placeholder="Enter current password" required>
                                <button type="button" class="toggle-password absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600" data-target="current-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- New Password Field -->
                        <div>
                            <label for="new-password" class="block text-sm font-semibold text-gray-600 ml-2 mb-1">
                                New Password *
                            </label>
                            <div class="relative">
                                <input type="password" id="new-password" name="newPassword"
                                    class="w-full px-3 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)] transition-all duration-200 text-gray-900 placeholder-gray-400 text-sm"
                                    placeholder="Enter new password" required>
                                <button type="button" class="toggle-password absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600" data-target="new-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1 ml-2 leading-relaxed">
                                Min 8 chars: 1 uppercase, 1 lowercase, 1 number & 1 special character.
                            </p>
                        </div>

                        <!-- Confirm New Password Field -->
                        <div>
                            <label for="confirm-password" class="block text-sm font-semibold text-gray-600 ml-2 mb-1">
                                Confirm New Password *
                            </label>
                            <div class="relative">
                                <input type="password" id="confirm-password" name="confirmPassword"
                                    class="w-full px-3 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)] transition-all duration-200 text-gray-900 placeholder-gray-400 text-sm"
                                    placeholder="Confirm new password" required>
                                <button type="button" class="toggle-password absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600" data-target="confirm-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-2">
                            <button type="submit" id="save-btn"
                                class="flex w-full items-center justify-center gap-2 rounded-xl bg-[var(--primary-color)] px-4 py-2.5 text-sm font-medium text-white transition-all duration-200 hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">
                                <span id="save-btn-text">Save Changes</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Powered By Section -->
                <div class="text-center mt-6 pt-4 border-t border-gray-200">
                    <div class="register-prompt">
                        <span class="text-gray-600 text-xs">Powered by <b>Victoria Enterprises LLC</b>, UAE</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hero Background Section -->
        <div class="hidden md:flex md:w-[60%] p-2">
            <div
                class="carousel-container relative h-full w-full overflow-hidden rounded-2xl bg-[url('../../Config/assets/images/Login_Bg.png')] bg-cover bg-center bg-no-repeat shadow-xl">
            </div>
        </div>

    </div>

    <script>
        $(document).ready(function () {
            // Configuration & Constants
            const DomainName = localStorage.getItem("Domain") || "http://taskserver.bhuvansystems.in";
            const session = JSON.parse(localStorage.getItem('LogUser') || '{}');
            const UserNo = Number(session.mTransNo || 0);

            // Toggle password field visibility
            $('.toggle-password').on('click', function () {
                const targetId = $(this).attr('data-target');
                const $input = $('#' + targetId);
                const isPassword = $input.attr('type') === 'password';
                
                $input.attr('type', isPassword ? 'text' : 'password');
                $(this).find('i').attr('class', `bi bi-eye${isPassword ? '-slash' : ''}`);
            });

            // Validation Helper
            function validatePassword(newPassword) {
                const minLength = 8;
                const hasUppercase = /[A-Z]/.test(newPassword);
                const hasLowercase = /[a-z]/.test(newPassword);
                const hasNumber = /[0-9]/.test(newPassword);
                const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(newPassword);

                return newPassword.length >= minLength && hasUppercase && hasLowercase && hasNumber && hasSpecial;
            }

            // Form Submit Handler
            $('#password-change-form').on('submit', function (e) {
                e.preventDefault();

                const currentPw = $('#current-password').val();
                const newPw = $('#new-password').val();
                const confirmPw = $('#confirm-password').val();

                // Front-end validations
                if (!currentPw) {
                    Swal.fire('Validation Error', 'Please enter your current password.', 'warning');
                    return;
                }

                if (!newPw) {
                    Swal.fire('Validation Error', 'Please enter a new password.', 'warning');
                    return;
                }

                if (!validatePassword(newPw)) {
                    Swal.fire('Validation Error', 'New password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one special character.', 'warning');
                    return;
                }

                if (newPw !== confirmPw) {
                    Swal.fire('Validation Error', 'New password and confirm password do not match.', 'warning');
                    return;
                }

                if (newPw === currentPw) {
                    Swal.fire('Validation Error', 'New password cannot be the same as current password.', 'warning');
                    return;
                }

                // Loading state
                const $saveBtn = $('#save-btn');
                $saveBtn.prop('disabled', true).css('opacity', '0.85').css('cursor', 'not-allowed');
                $('#save-btn-text').text('Saving...');
                if (window.LoadingOverlay) {
                    window.LoadingOverlay.show({ title: 'Saving changes...', skipExit: true });
                }

                // Call password change API
                // Endpoint: /api/Home/PasswordReset?Password={newPassword}&userNo={UserNo}
                $.ajax({
                    url: `${DomainName}/api/Home/PasswordReset?Password=${encodeURIComponent(newPw)}&userNo=${UserNo}`,
                    type: 'POST',
                    success: function (res) {
                        if (window.LoadingOverlay) window.LoadingOverlay.hide({ fast: true });

                        Swal.fire({
                            title: 'Success!',
                            text: 'Your password has been changed successfully. Please login again.',
                            icon: 'success',
                            confirmButtonText: 'OK'
                        }).then(() => {
                            // Logout user and redirect to login page
                            localStorage.clear();
                            window.location.replace('../../index.html');
                        });
                    },
                    error: function (xhr) {
                        if (window.LoadingOverlay) window.LoadingOverlay.hide({ fast: true });
                        $saveBtn.prop('disabled', false).css('opacity', '').css('cursor', '');
                        $('#save-btn-text').text('Save Changes');

                        const errMsg = xhr.responseText || 'Failed to change password. Please check your connection.';
                        Swal.fire('Error', errMsg, 'error');
                    }
                });
            });
        });
    </script>
</body>

</html>
