<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="../../Config/assets/images/favicon.ico" type="image/x-icon" sizes="any">
    <title>New Task Management</title>

    <!-- ───────────────────────────────────────────────────────────────── -->
    <!-- DEPENDENCIES -->
    <!-- ───────────────────────────────────────────────────────────────── -->

    <!-- Tailwind CSS (Using local CDN path as per project standard) -->
    <script src="../../Config/cdn/tailwindcss_3_4_17.js"></script>

    <!-- Bootstrap Icons (Required by navigation for icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../Config/style/global.css">

    <!-- GSAP for animations (Required by navigation.js) -->
    <script src="../../Config/cdn/gsap.min.js"></script>
    <script src="../../UI_Components/widgets/loading-overlay.js"></script>

    <!-- jQuery -->
    <script src="../../Config/cdn/jquery-3.7.1.min.js"></script>

    <!-- ───────────────────────────────────────────────────────────────── -->
    <!-- UI COMPONENTS -->
    <!-- ───────────────────────────────────────────────────────────────── -->

    <!-- Navigation Component Script -->
    <script src="../../UI_Components/layout/navigation.js"></script>

    <!-- KPI Manager Script -->
    <script src="../../UI_Components/widgets/kpi-manager.js"></script>

    <!-- AG Grid -->
    <script src="../../Config/cdn/ag-grid-community.min.js"></script>

    <!-- Select2 -->
    <link href="../../Config/cdn/select2.min.css" rel="stylesheet" />
    <script src="../../Config/cdn/select2.full.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="../../Config/cdn/sweetalert2_11.js"></script>

    <!-- UI Button Component -->
    <script src="../../UI_Components/widgets/ui-button.js"></script>

    <!-- Premium Input Styles -->
    <script src="../../UI_Components/modals/components/input-field.js"></script>

    <!-- Premium Select2 Component -->
    <script src="../../UI_Components/modals/components/select2-field.js"></script>

    <!-- Popup Modal Component -->
    <script src="../../UI_Components/modals/popup-modal.js"></script>

    <!-- Data Grid Component -->
    <script src="../../UI_Components/layout/data-grid.js"></script>

    <!-- Modal Grid Component -->
    <script src="../../UI_Components/modals/components/modal-grid.js"></script>
</head>

<body class="w-screen app-shell-container overflow-hidden">

    <!-- ───────────────────────────────────────────────────────────────── -->
    <!-- PAGE SHELL (Standard layout containers for navigation) -->
    <!-- ───────────────────────────────────────────────────────────────── -->

    <div class="h-full w-full flex relative">
        <!-- 1. Sidebar Container: Hosts the vertical navigation menu on desktop screens -->
        <div id="sidebar-container" class="h-full flex-shrink-0"></div>

        <div class="flex-1 flex flex-col h-full overflow-hidden pb-14 sm:pb-0">
            <!-- 2. Top Navigation Container: Hosts the top header bar with user profile, breadcrumbs, etc. -->
            <div id="top-nav-container"></div>

            <!-- 3. Main Content Canvas: The primary scrollable area for page content -->
            <main id="main-canvas" class="relative flex-1 bg-gray-50/40 overflow-y-auto flex flex-col">
                <!-- Tabs Row -->
                <div class="px-6 bg-white border-b border-gray-200">
                    <div class="flex gap-6 overflow-x-auto no-scrollbar" id="frequency-tabs" role="tablist">
                        <button type="button" data-freq-tab="all"
                            class="py-3 text-sm font-semibold border-b-2 border-secondary-500 text-secondary-500 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">All</button>
                        <button type="button" data-freq-tab="particular"
                            class="py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">One-time</button>
                        <button type="button" data-freq-tab="daily"
                            class="py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">Daily</button>
                        <button type="button" data-freq-tab="weekly"
                            class="py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">Weekly</button>
                        <button type="button" data-freq-tab="monthly"
                            class="py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">Monthly</button>
                        <button type="button" data-freq-tab="quarterly"
                            class="py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">Quarterly</button>
                        <button type="button" data-freq-tab="yearly"
                            class="py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition-all duration-200 focus:outline-none whitespace-nowrap flex-shrink-0">Yearly</button>
                    </div>
                </div>

                <!-- 4. KPI Manager: Custom component displaying key performance indicators at the top -->
                <premium-kpi-manager id="kpiManager"></premium-kpi-manager>

                <!-- 5. Premium Grid: Custom data grid component for listing tasks -->
                <premium-grid id="task-grid" class="w-full flex-1 min-h-0 mb-4 sm:mb-0" data-show-sino="true"
                    data-show-actions="true" data-row-id-field="mTransNo" data-pagination="true"
                    data-pagination-page-size="15" data-pagination-page-size-selector="[5, 10, 15, 20, 50]"
                    data-floating-filter="false" data-row-height="40" data-auto-fill-height="true" data-min-height="200"
                    data-suppress-size-to-fit="false" data-action-view="viewRecord" data-action-edit="editRecord"
                    data-action-delete="deleteRecord">
                    <!-- Declare our custom UI Button right here in the HTML! -->
                    <div slot="actions" class="flex items-center gap-3">
                        <premium-button id="add-task-btn" icon="bi-plus-circle" label="Add Task" variant="solid"
                            bg-color="bg-white" border-color="border-gray-300" text-color="text-black"></premium-button>
                    </div>
                </premium-grid>

                <!-- 6. Popup Modal: Custom popup modal component for adding/editing a task -->
                <premium-popup-modal id="task-modal" data-width="750px" data-max-width="95%" data-height="600px">
                    <template data-modal-body>
                        <form id="task-form" class="space-y-4" onsubmit="return false;">
                            <input type="hidden" id="task-id" value="0">

                            <!-- Company Selection -->
                            <div class="space-y-1">
                                <label data-premium-label>Company *</label>
                                <select id="task-company" class="w-full" data-premium-input required></select>
                            </div>

                            <!-- Assignment Type & Resent Task -->
                            <div class="flex items-center justify-between">
                                <div class="space-y-1">
                                    <label data-premium-label>Assignment Type *</label>
                                    <div class="flex items-center gap-6 mt-1">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="assignmentType" value="individual" checked
                                                class="w-4 h-4 text-secondary-600 border-gray-300 focus:ring-secondary-500">
                                            <span class="text-sm font-medium text-gray-700">Individual</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="assignmentType" value="group"
                                                class="w-4 h-4 text-secondary-600 border-gray-300 focus:ring-secondary-500">
                                            <span class="text-sm font-medium text-gray-700">Group</span>
                                        </label>
                                    </div>
                                </div>
                                <premium-button id="resent-task-btn" icon="bi-fast-forward-circle" label="Resent Task"
                                    variant="outline" bg-color="bg-white" text-color="text-gray-700"
                                    border-color="border-gray-300"></premium-button>
                            </div>

                            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                                <!-- Assignee Selection -->
                                <div class="space-y-1">
                                    <label id="assignment-select-label" data-premium-label>Select Employee *</label>
                                    <select id="task-assignee" class="w-full" data-premium-input required></select>
                                </div>

                                <!-- Task Name -->
                                <div class="space-y-1">
                                    <label data-premium-label>Task Name *</label>
                                    <input type="text" id="task-name" data-premium-input placeholder="Enter task name"
                                        required>
                                </div>
                            </div>
                            <!-- Description -->
                            <div class="space-y-1">
                                <label data-premium-label>Task Description *</label>
                                <textarea id="task-description" data-premium-input rows="3"
                                    placeholder="Describe the task details..." required></textarea>
                            </div>
                            <div id="group-members-container" class="grid grid-cols-1 space-y-1 hidden">
                                <label data-premium-label>Group Members</label>
                                <textarea id="group-members-list" data-premium-input rows="2" readonly
                                    class="bg-gray-50 resize-none text-sm"></textarea>
                            </div>
                            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                                <div class="space-y-1">
                                    <label data-premium-label>Priority *</label>
                                    <select id="task-priority" class="w-full" data-premium-input required>
                                        <option value="High">High</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="Low">Low</option>
                                    </select>
                                </div>
                                <div class="space-y-1">
                                    <label data-premium-label>Task Assign Type *</label>
                                    <select id="task-frequency" class="w-full" data-premium-input required>
                                        <option value="particular" selected>One-time</option>
                                        <option value="daily">Daily</option>
                                        <option value="weekly">Weekly</option>
                                        <option value="monthly">Monthly</option>
                                        <option value="quarterly">Quarterly</option>
                                        <option value="yearly">Yearly</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Scheduling Inputs -->
                            <div class="grid grid-cols-1 gap-4 sm:grid-cols-3 mt-4">
                                <!-- 1. Start Date -->
                                <div id="panel-start-date" class="space-y-1">
                                    <label data-premium-label>Start Date *</label>
                                    <input type="date" id="task-start-date" data-premium-input required>
                                </div>

                                <!-- 2. Due Date -->
                                <div id="panel-due-date" class="space-y-1">
                                    <label data-premium-label>Due Date *</label>
                                    <input type="date" id="task-due-date" data-premium-input required>
                                </div>

                                <!-- 3. Due Time -->
                                <div class="space-y-1">
                                    <label data-premium-label>Due Time *</label>
                                    <input type="time" id="task-due-time" data-premium-input required>
                                </div>
                            </div>
                        </form>
                    </template>
                </premium-popup-modal>

                <!-- Resent Tasks Popup Modal -->
                <premium-popup-modal id="resent-task-modal" data-width="800px" data-max-width="95%" data-height="400px">
                    <template data-modal-body>
                        <div class="w-full">
                            <premium-modal-grid id="resent-task-grid" class="w-full h-full" data-show-sino="true"
                                data-show-actions="false" data-suppress-size-to-fit="false" data-row-height="40"
                                data-min-height="200"></premium-modal-grid>
                        </div>
                    </template>
                </premium-popup-modal>
            </main>
        </div>
    </div>

    <!-- 8. Mobile Bottom Navigation: Replaces sidebar on small mobile screens -->
    <div id="bottom-nav-container"></div>


    <!-- ───────────────────────────────────────────────────────────────── -->
    <!-- PAGE SCRIPTS -->
    <!-- ───────────────────────────────────────────────────────────────── -->
    <script>
        // ╔══════════════════════════════════════════════════════════════════╗
        // ║ In-Memory Offline Mock CRUD Engine                               ║
        // ╚══════════════════════════════════════════════════════════════════╝

        // ╔══════════════════════════════════════════════════════════════════╗
        // ║ New Task Management                                              ║
        // ║ NewDesign Type-1 module using AccountMaster-style structure.     ║
        // ╚══════════════════════════════════════════════════════════════════╝
        //
        //  SECTIONS:  1-CONSTANTS  2-STATE  3-DATA  4-UI HELPERS
        //             5-FEATURE LOGIC  6-COMPONENTS  7-EVENTS  8-INIT

        // ─────────────────────────────────────────────────────────────────
        // SECTION 1 — CONSTANTS & SESSION
        // ─────────────────────────────────────────────────────────────────
        if (!JSON.parse(localStorage.getItem('LogUser'))) {
            window.location.href = '/Index.html';
        }

        var _logUser = JSON.parse(localStorage.getItem('LogUser'));
        var DomainName = (localStorage.getItem('Domain') || '').trim().replace(/\/+$/, '');
        var mSubscID = _logUser.subscID;
        var UserNo = Number(_logUser.mTransNo);
        var mUserType = _logUser.userType;
        var Designation = _logUser.designation;
        var LinkNo = _logUser.linkNo;
        var mBranch = localStorage.getItem('Branch');

        // ─────────────────────────────────────────────────────────────────
        // SECTION 2 — STATE
        // ─────────────────────────────────────────────────────────────────
        var taskGridApi = null;
        var selectedFreqTab = 'all';

        // ─────────────────────────────────────────────────────────────────
        // SECTION 3 — DATA
        // ─────────────────────────────────────────────────────────────────
        var dummyEmployees = [];

        var dummyGroups = [];

        var dummyCompanies = [];

        var mockTaskList = [];

        // ─────────────────────────────────────────────────────────────────
        // SECTION 4 — UI HELPERS
        // ─────────────────────────────────────────────────────────────────
        function formatDateDisplay(ymd) {
            var s = $.trim(String(ymd || '')).slice(0, 10);
            if (!s) return '—';
            var p = s.split('-');
            if (p.length !== 3) return s;
            return p[2] + '-' + p[1] + '-' + p[0];
        }
        var employeeCache = null;
        var groupCache = null;

        function refreshAssigneeSelectOptions(type) {
            var $select = $('#task-assignee');
            var label = document.getElementById('assignment-select-label');
            var companyId = $('#task-company').val();
            var modal = document.getElementById('task-modal');

            if (label) {
                label.innerText = type === 'group' ? 'Select Group *' : 'Select Employee *';
            }

            $select.empty();

            if (!companyId) {
                PremiumSelect2.init($select[0], {
                    placeholder: 'Select Company First...',
                    dropdownParent: PremiumSelect2.dropdownParentFromModal(modal),
                    allowClear: false,
                    options: []
                });
                return;
            }

            PremiumSelect2.init($select[0], {
                placeholder: 'Loading...',
                dropdownParent: PremiumSelect2.dropdownParentFromModal(modal),
                allowClear: false,
                options: []
            });

            var domain = (typeof localStorage !== 'undefined' ? localStorage.getItem('Domain') : '') || '';
            var compLower = $.trim(companyId).toLowerCase();

            if (type === 'individual') {
                var loadUsers = function (data) {
                    var filtered = [];
                    $.each(data, function (i, row) {
                        var c = $.trim(row.oprCompany || row.branch || row.company || '').toLowerCase();
                        var isActive = (row.lockStatus === 'Y'); // Only include active users
                        // Include if active AND company matches selected company OR belongs to "All Company"
                        if (isActive && (c === compLower || c === 'all company' || c === 'allcompany' || c === 'all')) {
                            filtered.push({
                                id: row.mTransNo || row.id || row.userNo,
                                text: row.userName || row.firstName || row.name || row.text || ('User ' + row.mTransNo)
                            });
                        }
                    });

                    $select.empty();
                    PremiumSelect2.init($select[0], {
                        placeholder: 'Select Employee...',
                        dropdownParent: PremiumSelect2.dropdownParentFromModal(modal),
                        allowClear: false,
                        options: filtered
                    });
                };

                if (employeeCache) {
                    loadUsers(employeeCache);
                } else {
                    $.get(domain + '/api/UserMaster/api/GetData/List?SubscID=' + (typeof mSubscID !== 'undefined' ? mSubscID : 0), function (res) {
                        employeeCache = Array.isArray(res) ? res : (res && res.data ? res.data : []);
                        loadUsers(employeeCache);
                    });
                }

            } else {
                var loadGroups = function (data) {
                    var filtered = [];
                    $.each(data, function (i, row) {
                        var c = $.trim(row.company || row.grpCompany || row.GrpCompany || row.groupCompany || '').toLowerCase();
                        // Include if company matches selected company OR if it belongs to "All Company"
                        if (c === compLower || c === 'all company' || c === 'allcompany' || c === 'all') {
                            filtered.push({
                                id: row.mTransNo || row.MTransNo || row.id || row.Id || row.groupId,
                                text: row.groupName || row.GroupName || row.name || row.text || ('Group ' + (row.mTransNo || row.id))
                            });
                        }
                    });

                    $select.empty();
                    PremiumSelect2.init($select[0], {
                        placeholder: 'Select Group...',
                        dropdownParent: PremiumSelect2.dropdownParentFromModal(modal),
                        allowClear: false,
                        options: filtered
                    });
                };

                if (groupCache) {
                    loadGroups(groupCache);
                } else {
                    $.get(domain + '/api/TaskGroup/GetData/' + (typeof mSubscID !== 'undefined' ? mSubscID : 0), function (res) {
                        groupCache = Array.isArray(res) ? res : (res && res.data ? res.data : []);
                        loadGroups(groupCache);
                    });
                }
            }
        }

        window.toggleFrequencyPanels = function (freq) {
            document.getElementById('panel-due-date').classList.remove('hidden');
            document.getElementById('panel-start-date').classList.remove('hidden');

            var dueTimeLabel = document.getElementById('due-time-label');
            if (dueTimeLabel) {
                dueTimeLabel.innerText = freq === 'daily' ? 'Due Time (daily) *' : 'Due Time *';
            }

            document.getElementById('task-due-date').required = true;
            document.getElementById('task-start-date').required = true;
        };

        function populateModalFields(data) {
            document.getElementById('task-id').value = data.mTransNo || '0';
            document.getElementById('task-name').value = data.taskName || '';

            $('#task-priority').val(data.priority || 'Medium').trigger('change');

            var statusEl = document.getElementById('task-status');
            if (statusEl) {
                $(statusEl).val(data.status || 'Open').trigger('change');
            }

            document.getElementById('task-description').value = data.description || '';

            // Recover Company ID from assignee if missing
            var resolvedCompany = data.companyId || '';
            if (!resolvedCompany && data.assigneeId) {
                if (data.assignmentType === 'group') {
                    if (groupCache) {
                        var g = groupCache.find(function (x) {
                            var id = x.mTransNo || x.id || x.groupId || x.MTransNo;
                            return String(id) === String(data.assigneeId);
                        });
                        if (g) {
                            resolvedCompany = g.company || g.grpCompany || g.GrpCompany || g.groupCompany || '';
                        }
                    }
                } else {
                    if (employeeCache) {
                        var u = employeeCache.find(function (x) {
                            var id = x.mTransNo || x.id || x.userNo;
                            return String(id) === String(data.assigneeId);
                        });
                        if (u) {
                            resolvedCompany = u.oprCompany || u.branch || u.company || '';
                        }
                    }
                }
            }

            var $compSelect = $('#task-company');
            if (resolvedCompany) {
                if (!$compSelect.find("option[value='" + resolvedCompany + "']").length) {
                    var newCompOpt = new Option(resolvedCompany, resolvedCompany, true, true);
                    $compSelect.append(newCompOpt).trigger('change');
                } else {
                    $compSelect.val(resolvedCompany).trigger('change');
                }
            } else {
                $compSelect.val('').trigger('change');
            }

            var radioSelector = 'input[name="assignmentType"][value="' + (data.assignmentType || 'individual') + '"]';
            var radioEl = document.querySelector(radioSelector);
            if (radioEl) {
                radioEl.checked = true;
            }

            refreshAssigneeSelectOptions(data.assignmentType || 'individual');

            var $assigneeSelect = $('#task-assignee');
            if (data.assigneeId) {
                if (!$assigneeSelect.find("option[value='" + data.assigneeId + "']").length) {
                    var newAssigneeOpt = new Option(data.assignmentLabel || 'Assignee', data.assigneeId, true, true);
                    $assigneeSelect.append(newAssigneeOpt).trigger('change');
                } else {
                    $assigneeSelect.val(data.assigneeId).trigger('change');
                }
            } else {
                $assigneeSelect.val('').trigger('change');
            }

            var freq = data.frequency || 'particular';
            $('#task-frequency').val(freq).trigger('change');

            document.getElementById('task-start-date').value = data.taskDate || data.duedate || '';
            document.getElementById('task-due-date').value = data.duedate || '';
            document.getElementById('task-due-time').value = data.dueTime || '';

            toggleFrequencyPanels(freq);
        }

        // ─────────────────────────────────────────────────────────────────
        // SECTION 5 — FEATURE LOGIC
        // ─────────────────────────────────────────────────────────────────
        window.updateDashboardKPIs = function () {
            var kpi = document.getElementById('kpiManager');
            if (!kpi) return;

            var total = mockTaskList.length;
            var high = mockTaskList.filter(t => t.priority === 'High').length;
            var completed = mockTaskList.filter(t => t.status === 'Completed' || t.status === 'Complete').length;

            var todayStr = new Date().toISOString().split('T')[0];
            var overdue = mockTaskList.filter(t => t.status !== 'Completed' && t.status !== 'Complete' && t.duedate < todayStr).length;

            kpi.setCards([
                { id: 'total_tasks', label: 'Total Tasks', value: String(total), icon: 'bi-collection' },
                { id: 'high_priority', label: 'High Priority', value: String(high), icon: 'bi-exclamation-octagon' },
                { id: 'overdue_tasks', label: 'Overdue Tasks', value: String(overdue), icon: 'bi-exclamation-triangle' },
                { id: 'completed_tasks', label: 'Completed Tasks', value: String(completed), icon: 'bi-check-circle' }
            ]);
        };

        var tasksLoaded = false;
        function loadTasksFromApi(done) {
            var domain = DomainName || '';
            if (!domain) {
                if (done) done();
                return;
            }
            var grid = document.getElementById('task-grid');
            if (grid && typeof grid.setLoading === 'function') grid.setLoading(true, 'Loading tasks...');

            $.ajax({
                url: domain + '/api/Task/TaskDataSender?userNo=' + encodeURIComponent(UserNo),
                method: 'GET',
                success: function (json) {
                    var raw = Array.isArray(json) ? json : (json.data || json.Data || json.result || []);
                    mockTaskList = raw.map(function (row) {
                        var dateOnly = function (value) {
                            if (!value) return '';
                            var s = String(value);
                            var t = s.indexOf('T');
                            return t >= 0 ? s.slice(0, 10) : s.slice(0, 10);
                        };
                        var assignToNo = row.assignto != null ? row.assignto
                            : row.assignTo != null ? row.assignTo
                                : row.Assignto != null ? row.Assignto
                                    : row.assignUserNo != null ? row.assignUserNo
                                        : row.AssignUserNo != null ? row.AssignUserNo
                                            : row.taskAssignUserNo != null ? row.taskAssignUserNo
                                                : row.userAssignNo != null ? row.userAssignNo
                                                    : null;
                        var groupMetaId = row.groupTransNo != null && row.groupTransNo !== '' ? row.groupTransNo
                            : row.GroupTransNo != null && row.GroupTransNo !== '' ? row.GroupTransNo
                                : row.taskGroupId != null && row.taskGroupId !== '' ? row.taskGroupId
                                    : row.TaskGroupId != null && row.TaskGroupId !== '' ? row.TaskGroupId
                                        : row.groupMTransNo != null && row.groupMTransNo !== '' ? row.groupMTransNo
                                            : null;

                        var atype = (row.assignmentType === 'group' || row.AssignmentType === 'group') ? 'group' : 'individual';
                        var assignTarget = assignToNo != null && assignToNo !== '' ? String(assignToNo) : '';
                        if (atype === 'group' && groupMetaId != null && groupMetaId !== '') {
                            assignTarget = String(groupMetaId);
                        }

                        // Assignee Name: map directly to row.assignName or row.AssignName
                        var assignLabel = row.assignName || row.AssignName || '';

                        var rawAssignType = (row.taskAssignType || row.frequency || 'particular').toString().toLowerCase().trim();
                        var assignTypeStr = (rawAssignType === 'one-time' || rawAssignType === 'onetime') ? 'particular' : rawAssignType;
                        var displayAssignType = assignTypeStr === 'particular' ? 'One-time' : (assignTypeStr.charAt(0).toUpperCase() + assignTypeStr.slice(1));

                        return {
                            id: row.mTransNo || row.id,

                            taskName: row.taskName || row.TaskName || '',
                            duedate: dateOnly(row.duedate != null ? row.duedate : row.duedate),

                            status: row.status || row.taskStatus || 'Open',

                            taskDate: dateOnly(row.taskDate != null ? row.taskDate : row.TaskDate),
                            taskAssignType: displayAssignType,
                            groupMetaId: groupMetaId,
                            rawTaskAssignType: row.taskAssignType || row.TaskAssignType || ''
                        };
                    });

                    mockTaskList = dedupeAndResolveGroupTasks(mockTaskList);

                    if (grid && typeof grid.setLoading === 'function') grid.setLoading(false);
                    if (done) done();
                },
                error: function (xhr) {

        function dedupeAndResolveGroupTasks(taskList) {
            var grouped = {};
            $.each(taskList, function (i, t) {
                var mNo = String(t.mTransNo);
                if (!grouped[mNo]) {
                    grouped[mNo] = [];
                }
                grouped[mNo].push(t);
            });

            var result = [];
            var frequencies = ['particular', 'one-time', 'daily', 'weekly', 'monthly', 'quarterly', 'yearly'];

            $.each(grouped, function (mNo, rows) {
                var first = rows[0];
                if (rows.length > 1) {
                    var gName = 'Group Task';
                    var gId = '';
                    $.each(rows, function (j, r) {
                        if (r.groupMetaId) {
                            gId = r.groupMetaId;
                            return false;
                        }
                    });

                    if (gId && groupCache) {
                        var gObj = groupCache.find(function (g) {
                            var id = g.mTransNo || g.MTransNo || g.id || g.Id || g.groupId;
                            return String(id) === String(gId);
                        });
                        if (gObj) {
                            gName = gObj.groupName || gObj.name || gName;
                        }
                    } else if (first.rawTaskAssignType && frequencies.indexOf(first.rawTaskAssignType.toLowerCase()) === -1) {
                        gName = first.rawTaskAssignType;
                    }

                    // Try to resolve group by matching member IDs against groupCache
                    if (gName === 'Group Task' && groupCache) {
                        var assigneeIds = rows.map(function (r) { return String(r.assigneeId); }).filter(Boolean).sort().join(',');
                        var foundGroup = groupCache.find(function (g) {
                            var team = String(g.groupTeam || '').split(',').map(function (s) { return $.trim(s); }).filter(Boolean).sort().join(',');
                            return team && team === assigneeIds;
                        });
                        if (foundGroup) {
                            gName = foundGroup.groupName || foundGroup.name || gName;
                        }
                    }

                    first.assignmentLabel = gName;
                    first.assignmentType = 'group';
                } else {
                    if (first.groupMetaId && groupCache) {
                        var gObj = groupCache.find(function (g) {
                            var id = g.mTransNo || g.MTransNo || g.id || g.Id || g.groupId;
                            return String(id) === String(first.groupMetaId);
                        });
                        if (gObj) {
                            first.assignmentLabel = gObj.groupName || gObj.name || first.assignmentLabel;
                            first.assignmentType = 'group';
                        }
                    }
                }
                result.push(first);
            });
            return result;
        }

                                        return;
                                    }
                                    if (res && res.message && String(res.message).toLowerCase().indexOf('duplicate') !== -1) {
                                        Swal.fire({ title: 'Duplicate Detected', text: 'Duplicate record detected.', icon: 'warning', heightAuto: false });
                                        return;
                                    }

                                    // Extract the new mTransNo returned by the server
                                    var taskMTransNo = 0;
                                    try {
                                        var ct = (jqXHR.getResponseHeader('Content-Type') || '').toLowerCase();
                                        if (ct.indexOf('application/json') !== -1) {
                                            var parsed = JSON.parse(res);
                                            taskMTransNo = Number(parsed.mTransNo || parsed.id || 0) || 0;
                                        } else {
                                            var m = String(res).match(/\^(\d+)/);
                                            taskMTransNo = m ? Number(m[1]) : 0;
                                        }
                                    } catch (e) { }

                                    // ── Step 2: Assign to User → /api/Task/api/SaveDataDtl ──
                                    // assignto  = numeric user ID
                                    // assignName = display name of the selected employee/group
                                    var membersToSave = [];
                                    if (assignType === 'group') {
                                        var groupObj = null;
                                        if (groupCache) {
                                            groupObj = groupCache.find(function (g) {
                                                var gId = g.mTransNo || g.MTransNo || g.id || g.Id || g.groupId;
                                                return String(gId) === String(selectVal);
                                            });
                                        }
                                        if (groupObj && groupObj.groupTeam) {
                                            var memberIds = String(groupObj.groupTeam).split(',').map(function (id) { return $.trim(id); }).filter(Boolean);
                                            $.each(memberIds, function (i, uid) {
                                                var userName = 'User ' + uid;
                                                if (employeeCache) {
                                                    var userOpt = employeeCache.find(function (u) {
                                                        var uId = u.mTransNo || u.id || u.userNo;
                                                        return String(uId) === String(uid);
                                                    });
                                                    if (userOpt) {
                                                        userName = userOpt.userName || userOpt.firstName || userOpt.name || userOpt.text || userName;
                                                    }
                                                }
                                                membersToSave.push({ id: Number(uid) || 0, name: userName });
                                            });
                                        }
                                    }

                                    if (membersToSave.length === 0) {
                                        // Individual assignment or fallback
                                        membersToSave.push({ id: Number(selectVal) || 0, name: assignLabel });
                                    }

                                    var saveIndex = 0;
                                    function saveNextMember() {
                                        if (saveIndex >= membersToSave.length) {
                                            modal.close();
                                            Swal.fire({ title: 'Success!', text: 'Task created successfully.', icon: 'success', heightAuto: false });
                                            tasksLoaded = false;
                                            window.loadTasksIntoGrid(true);
                                            return;
                                        }

                                        var currentMember = membersToSave[saveIndex];
                                        var assignPayload = JSON.stringify({
                                            id: 0,
                                            mTransNo: taskMTransNo,
                                            mCount: 0,
                                            slNo: saveIndex + 1,
                                            assignto: currentMember.id,
                                            assignName: currentMember.name,
                                            Acceptdate: duedateIso,
                                            assignDate: nowIso,
                                            assignTime: new Date().toLocaleTimeString('en-US', { hour12: false }),
                                            systemIP: '1',
                                            createdBy: UserNo,
                                            createdOn: nowIso,
                                            subscID: Number(mSubscID) || 0,
                                            status: 'Insert'
                                        });

                                        $.ajax({
                                            url: DomainName + '/api/Task/api/SaveDataDtl',
                                            type: 'POST',
                                            contentType: 'application/json; charset=UTF-8',
                                            data: assignPayload,
                                            success: function () {
                                                saveIndex++;
                                                saveNextMember();
                                            },
                                            error: function (xhr) {
                                                Swal.fire({ title: 'Error', text: 'Task saved but assignment failed for ' + currentMember.name + '. (' + xhr.status + ')', icon: 'warning', heightAuto: false });
                                                tasksLoaded = false;
                                                window.loadTasksIntoGrid(true);
                                            }
                                        });
                                    }

                                    saveNextMember();
                                },
                                error: function (xhr) {
                                    var errText = (xhr.responseText || '').toLowerCase();
                                    if (errText.indexOf('duplicate') !== -1) {
                                        Swal.fire({ title: 'Duplicate Detected', text: 'Duplicate record detected.', icon: 'warning', heightAuto: false });
                                    } else {
                                        Swal.fire({ title: 'Save Failed', text: 'Could not save task (' + xhr.status + '). Please try again.', icon: 'error', heightAuto: false });
                                    }
                                }
                            });
                        }
                    });

                    var form = document.getElementById('task-form');
                    if (form) form.reset();
                    document.getElementById('task-id').value = '0';
                    document.querySelector('input[name="assignmentType"][value="individual"]').checked = true;

                    refreshAssigneeSelectOptions('individual');
                    initSelect2Fields();
                });
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // SECTION 8 — INIT
        // ─────────────────────────────────────────────────────────────────
        $(document).ready(function () {
            renderComponents();
            initSelect2Fields();
            bindEvents();

            // Warm employee and group caches at startup
            var domain = DomainName || '';
            var subId = typeof mSubscID !== 'undefined' ? mSubscID : 0;
            if (domain) {
                $.get(domain + '/api/UserMaster/api/GetData/List?SubscID=' + subId, function (res) {
                    employeeCache = Array.isArray(res) ? res : (res && res.data ? res.data : []);
                });
                $.get(domain + '/api/TaskGroup/GetData/' + subId, function (res) {
                    groupCache = Array.isArray(res) ? res : (res && res.data ? res.data : []);
                });
            }
        });
    </script>

</body>

</html>
